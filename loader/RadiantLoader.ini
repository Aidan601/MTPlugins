; Settings for d3d9.dll, the plugin loader. Keep this file next to it (<root>\bin).
; It starts the plugin host when an editor opens and forwards every Direct3D 9 call to System32\d3d9.dll.

[loader]
; 0 = forward only, do not load the plugin host (a quick way to start Radiant plugin-free)
enabled=1
; the plugin host to load, empty = RadiantPlugins.dll next to this file
dll=
; only load into these executables (comma separated)
process=Radiant_modtools.exe,asseteditor_modtools.exe,modlauncher.exe
; wait this long (ms) before loading the host
delay_ms=0
; append what happened to RadiantLoader.log next to this file
log=1
