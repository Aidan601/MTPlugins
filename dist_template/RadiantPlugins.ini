; RadiantPlugins host settings. Keep this file next to RadiantPlugins.dll. Missing keys use defaults.
; Every plugin has its own ini next to its DLL (<game>\bin\plugins\<Name>\<Name>.ini).

[radiant]
; game folder, only needed when TA_TOOLS_PATH is not set (the mod tools installer sets it)
; root=C:\Program Files (x86)\Steam\steamapps\common\Call of Duty Black Ops III

[plugins]
; where plugins are loaded from, empty = <game>\bin\plugins
dir=
; 1 = a plugin that crashes in a callback is disabled and a minidump is written, 0 = let Radiant crash
isolate=1
; 1 = a plugin found in the folder without an entry in plugins.ini is loaded; 0 = new plugins stay off until ticked
autoload_new=1

[window]
; maximize the Radiant main window after it appears
maximize=0

[render]
; fallback camera FOV for 3D overlays when Radiant's live FOV cannot be read, empty = Radiant's Camera preference
; game_fov is the GAME VIEW FOV (65 like the game)
fov=
game_fov=65
pitch_sign=1
; plugin text in the 3D view: 1 = Radiant's HUD font, 0 = line font
engine_text=1
; darkness of the box behind that text, 0-255 (0 = no box)
text_background=128

[browse]
; plugin list for Browse plugins, empty = the public list (github.com/Aidan601/MTPlugins-Index)
index=

[update]
; 1 = the launcher offers a newer MTPlugins release from GitHub at start, 0 = never ask
check=1

[ape]
; 1 = APE's startup GDT walk opens only the folders that held a GDT last time (index: RadiantPlugins.apegdt.txt),
; a background walk catches new ones. 0 = APE's full walk
fast_gdt_scan=1

[log]
verbose=0
