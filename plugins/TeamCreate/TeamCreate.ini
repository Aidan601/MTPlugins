; Team Create plugin settings. Lives next to TeamCreate.dll. Missing keys use defaults.

[net]
; off | host | client: the pane's default role (the pane writes it back). A session starts from the pane, not at launch, unless autostart=1
role=off
autostart=0
host=127.0.0.1
; host only: address to listen on. 0.0.0.0 = all interfaces (firewall asks once), 127.0.0.1 = this PC only
bind=0.0.0.0
; TCP port of the session (BO3's LAN game uses UDP 27017, so one forward for both covers everything)
port=27017
name=
; 1 = the pane's "Hide" box is ticked: the host's address shows as dots
hide_ip=1
; your player colour as #RRGGBB, empty = automatic (pick it in the pane)
color=

[sync]
; object sync: share brush/entity edits with peers
enabled=1
apply_delay_ms=700
; 1 = apply remote edits in place through Radiant's paste/delete path (keeps your selection), 0 = always write + reload
in_place=1
; keep the 3D camera where it was when the reload path is used
keep_camera=1
; 1 = a brush or model another mapper drags moves live in your view, 0 = boxes only (translation only, rotation and scale arrive on deselect)
live_move=1
; 1 = key/value edits of a selected entity reach the others about a second later, 0 = only on deselect
live_keys=1
; 1 = "Sync saves" box: your save makes the other mappers save too (not prefab files, Save As or autosaves)
sync_saves=0
; 1 = "Sync light builds" box: a light build starts the same build on the other PCs (pause and cancel are not shared)
sync_lights=0
; entity classes Radiant cannot paste fully formed (lighting fails on them), they arrive by a short reload. Comma separated, empty = none
reload_classes=reflection_probe

[backup]
; Copies a map or prefab file to <Black Ops III>\radiant\teamcreate_backup before Team Create rewrites it (also when a session starts)
enabled=1
; newest copies kept per map, 0 = keep everything
keep=20
; asset backup sessions (%LOCALAPPDATA%\RadiantPlugins\TeamCreate\asset_backups) older than asset_days are deleted except the newest asset_keep
; 0 = never delete (asset_days) or no floor (asset_keep)
asset_days=30
asset_keep=10

[log]
verbose=0

[diag]
; 1 = stream your log to the other mappers and send your last log and recent crash dumps on join, 0 = send nothing
share_logs=1
; store what the others send under plugins\TeamCreate\peerlogs\<their name>\
keep_peer_logs=1
; biggest dump to send in MB
dump_max_mb=80
dump_max_age_days=3

[assets]
; 1 = send Radiant's converted previews along with streamed models and images, 0 = source files only
send_converted=1

[zonesync]
; 1 = copy the host's new build in the background as soon as it is linked, so Join Host starts at once (never while BO3 runs)
prefetch=1

[direct]
; 1 = builds for Join Host travel straight between the two PCs when a link can be made, 0 = always through the session
enabled=1
; 1 = when the router opens no port, both PCs dial each other at the same time (hole punching, asks a STUN server for the public address)
punch=1
; STUN servers that answer over TCP as host:port, comma separated, empty = the built-in list
stun=
