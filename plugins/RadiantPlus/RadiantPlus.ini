; Radiant Plus plugin settings. Lives next to RadiantPlus.dll.

[fps]
; 1 = shorten Radiant's 17 ms idle tick so Preferences > Camera > Max FPS is honoured, 0 = Radiant's own
uncap=1
; idle tick in ms, 0 = derived from Max FPS
tick_ms=0
; 1 = every view redraw waits for its exact Max FPS slot (never above the cap, camera moves included), 0 = Radiant's own limiter only
pace=1

[profile]
; seconds captured by "RadiantPlus profile start"
window_seconds=10

[bake]
; Adaptive sampling per probe: map = the probe's own key, low / medium / high = at least that level on every probe
adaptive=map
; 1 = rescale Low and Medium probes to High's brightness (about 5 % more bake time at Low), 0 = Radiant's own
cone=1
; 1 = LL radio (draft tier, 64 rays per voxel instead of 256, noisier) in front of L / M / H, 0 = no LL radio
draft_radio=1
; 1 = hold a Build or Reload lighting until a cancelled bake's probe jobs finish, 0 = off
cancel_guard=1
; Reuse the free-space fill's neighbour lists between bounces: 1 = on, verify = also rebuild and compare, 0 = off
fill_cache=1
; Redo only the value arithmetic of the fill's plane fits between bounces: 1 = on, verify = compare with Radiant's, 0 = off
fill_fast=1
; Own voxel gather, bit-identical and about 30 % faster per bounce: 1 = on, verify = compare with Radiant's, 0 = off
gather_fast=1
; Traced-hit cache in plugins\RadiantPlus\trace_cache\: 1 = on, verify = trace anyway and compare, diag = log only, 0 = off
trace_cache=1
; size cap of that folder in MB
trace_cache_mb=4096
; experimental ray guiding, 0 = off
guide=0
; 1 = while a bake runs redraw the 3D view only every redraw_ms and step the bake up to budget_ms per tick, 0 = Radiant's own
boost=1
budget_ms=8
redraw_ms=500

[performance]
; 1 = on Direct3D 11 the big dynamic vertex and index buffers are drawn from twins that get only the written parts (no stall when the camera shows new geometry), 0 = Radiant's own
dynamic_buffers=1
; max 2D redraws per second while a mouse button is held, 0 = Radiant's own
xy_drag_hz=10
; max share (%) of the drag time spent on 2D frames, 100 = only the rate cap
xy_drag_share=20
; rate cap for a drag inside a 2D view, 0 = no exception
xy_focus_hz=60
; 1 = while panning, zooming or dragging the 2D views leave out small and off-view objects, 0 = Radiant's own
xy_lod=1
xy_lod_budget_ms=16
xy_lod_max_px=96
; 1 = prefetch the objects the 3D view walks each frame (game view off), 0 = Radiant's own
cam_prefetch=1
; 1 = open the files the last load of this map used on worker threads first (load_prefetch\), 0 = Radiant's own
load_prefetch=1
; 1 = keep the answers of the techset include searches during a map load, 0 = Radiant's own
file_search_cache=1
; 1 = skip the last-access write on converted assets during a load and set the times after it, 0 = Radiant's own
map_skip_asset_timestamp=1
; 1 = cache entity key tests and material name compares during a prefab rebuild or map load, 0 = Radiant's own
filter_cache=1
; Experimental early cull for 2D grid views (bounds outside the view are rejected, unknown bounds pass). `RadiantPlus gridcull 1` toggles it.
grid_cull=0
; world-unit border around the visible rectangle
grid_cull_padding=1024
; 1 = cache GPU memory statistics instead of querying the driver every frame
gpu_stats_cache=1
; refresh interval in ms (minimum 1000)
gpu_stats_ms=1000
; fast path while navigating heavy maps
interactive_fast_mode=1
; ms to keep the fast path after camera input stops
interactive_settle_ms=150
; skip pass-2 editor helper drawing in the fast path
interactive_skip_mode2=1
; suppress Update XY on drag while navigating
interactive_suppress_xy_drag=1
; draw real-lighting frames through a simpler camera mode while navigating
interactive_turbo_lighting=1
; camera mode used inside fast-path frames
interactive_turbo_mode=1

[gizmo]
; 1 = rotation rings around the pivot while Mouse Rotate is on (Shift snaps, right click cancels the drag)
rotate=1
; ring radius in pixels (30 to 400)
size_px=90
; 1 = the mouse wheel resizes the rings while the cursor is on one, 0 = the wheel moves the camera
size_wheel=1
; 1 = keep Radiant's own straight handles while Mouse Rotate is on
radiant_handles=0
; snap step in degrees (1 to 90) with Radiant's snap to grid on, 0 = Shift does nothing
snap_degrees=15

[camera]
; GAME VIEW field of view in the game's cg_fov convention (30 to 150), 65 = Radiant's own
game_fov=65

[camera_presets]
; Your own camera presets (written by the plugin): presetN=Name|code:action,... (code = Left 8 / Right 16 / Middle 32 + Ctrl 1 + Alt 2 + Shift 4), active = preset in use
count=0
active=

[fx]
; 1 = clicking an effect in the FX Browser sets the selected fx entities' fxdef, 0 = off
browser_apply=1

[fxpreview]
; 1 = the FX Browser shows every effect as a thumbnail, a click plays it in a preview box, drag it into the 3D view, 0 = Radiant's own browser only
browser=1
; 1 = the FX Browser's Legacy box is ticked: Radiant's own browser in place of the thumbnails
legacy=0
; preview box frames per second (5 to 60)
box_fps=30
; thumbnail size in the grid in px, 100 to 512 as in the Textures pane (the Icon Size slider, files are 128 px)
icon_size=128
; 1 = the XYZ grid (ground grid and axes) in the preview box and the thumbnails (Options > XYZ Grid), 0 = none (thumbnails from radiant\fx_thumbs_nogrid)
grid=1
; 1 = every thumbnail plays its effect on a loop, 0 = still pictures (Options > Play All)
animate=1
; 1 = the preview starts over when the effect ends (the Loop toggle under the preview box)
loop=1
; exposure (EV) the preview box and thumbnails are drawn with, so they look the same whatever the 3D view's auto exposure does, 0 = use the 3D view's
exposure=15.6

[prefabs]
; 1 = "Show in Explorer" in the Prefab Browser's right-click menu, 0 = off
show_in_explorer=1

[browsers]
; 1 = the Models and Textures Icon Size sliders resize the view while dragged, the full refresh runs when the slider rests
live_icon_size=1

[colorpicker]
; 1 = hex, 0-1 float and Kelvin rows, copy buttons and an eyedropper icon in Radiant's color dialog, 0 = off
extras=1
; 1 = the dialog's recent colors row is kept between sessions, 0 = Radiant's own (empty every launch)
keep_recent=1
; the recent colors as RRGGBBAA, newest first (written on OK)
recent=

[selection]
; 1 = a selected model shows its outline in the 3D view, seen through walls, 0 = its wireframe (Alt+J switches and saves it)
model_outline=1
; key for View > Toggle Model Outline, e.g. Alt+J or Ctrl+Shift+F5, empty = menu only
model_outline_key=Alt+J
; outline width in pixels (1 to 8)
model_outline_px=2

[files]
; 1 = Radiant's Open, Save and Import dialogs use the Windows file dialog, 0 = Radiant's own Qt dialog
windows_dialogs=0

[preferences]
; 1 = Settings > Preferences leaves the main window usable while it is open, 0 = Radiant's blocking dialog
modeless=1

[actionlog]
; 1 = show selections and edits in the Output pane (the "Log actions" box writes this)
enabled=0
; entries kept for "RadiantPlus actionlog tail" and radiant_action_log
max_lines=2000
; 1 = keep the last 15 minutes in actionlog.log for "Report a problem...", 0 = nothing recorded unless shown
in_reports=1

[crashguard]
; 0 turns all guards off
enabled=1
; repair a critical section whose debug pointer was wiped
critical_sections=1
; Radiant asserts: ask = Yes (continue) / No (exit) box, continue = log only, radiant = untouched
asserts=ask
; Entity Info with a null entity definition answers "no"
entity_info=1
; deselecting a brush that is not selected is a no-op
brush_deselect=1
; create OpenEXR's thread pool on the main thread at load
openexr_warmup=1
; rebuild the asset tree filter mapping before a filter change or clear
asset_tree=1
; a new face whose texture has no material is left untextured
face_texture=1
; Brush_Build skips a brush with a corrupt face table
brush_build=1
; a material handle that no longer resolves gets Radiant's default
material_lookup=1
; a brush with fewer than three faces gives the winding builder no points
winding_faces=1
; clear the load flags a failed map load (missing or empty file) leaves set
load_flags=1
; a beam reload that hits a beam missing from gdt.db (an effect names it) stops instead of crashing
beam_reload=1

[images]
; Extra image source formats for Radiant's converter beyond TIFF, PNG and EXR (comma separated, empty = Radiant's own)
extra_formats=jpg,jpeg

[theme]
; Radiant's look, picked in Preferences > Color > "Theme:". Empty or "default" = Radiant's own, classic = Qt's plain look,
; otherwise a <name>.qss in the themes folder (themes\README.txt). No name line = first run, Treyarch is written here.

[colors]
; 1 = picking a theme also picks the color preset of the same name ("Follow theme" box)
follow_theme=1
; 1 = a preset also sets the Shared tab's colors, 0 = those stay Radiant's defaults ("Shared colors" box)
shared=1

[discord]
; Discord Rich Presence: off, tool = only which tool is open, detail = also the map, asset or build step
mode=tool
; Discord application id, empty = the built-in one
app_id=
