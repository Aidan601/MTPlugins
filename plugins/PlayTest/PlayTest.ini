; Play Test plugin settings. BO3LiveBridge.dll must sit next to PlayTest.dll.

[playtest]
; 0 = no Play Test pane or menu
enabled=1
; save the map before building (Play needs the saved .map)
auto_save=1
; 1 = log every detail, 0 = a short summary (the pane's "Verbose log" box sets it)
verbose_log=0
; close a BlackOps3.exe this plugin started before launching a new one
kill_previous=1
; keep the game running between tests and reload the map in it
keep_warm=1
; start the game parked (hidden, muted, AI off) when a map with a finished build is open, so the first Play is a reload.
; It holds BO3 (and Steam's "playing" state) while you edit
prewarm_on_map_open=0
; the background start waits for this much free memory (GB), a parked game closes itself below park_min_free_gb
prewarm_min_free_gb=12
park_min_free_gb=3
; a cold Play starts BO3 at once while the map compiles and links (BO3 Enhanced only)
early_launch=1
; dock the game window into the "BO3 Live" pane
embed_game=1
; Smart Play also rebuilds the nav mesh (BO3 Enhanced with live_zone and live_navmesh: built beside the map compile, swapped into the level once it is up)
smart_rebuild_nav=1
; before building, export lighting built in Radiant's 3D view that was never exported (a .led newer than the fastfile always relinks)
export_lighting=1
; Live bake (BO3 Enhanced only): a finished light bake is exported, relinked and swapped into the running level (needs export_lighting=1)
live_bake=1
; fallback for a bake the running level could not take live: reload the level and put the player back (the match restarts). 0 = wait for the next Play
live_bake_reload=1
; install a changed probe layout from the relinked fastfile without a reload. 0 = always use the reload fallback
live_bake_layout=1
; test builds only: a marked, reversible GSC block makes a Zombies game over map_restart instead of going to the menu
auto_restart_gameover=1
; skip the Zombies startup black/fade (a marked GSC block)
instant_start=1
; Play From Here: spawn at Radiant's 3D camera, looking the same way (marked GSC receiver, br_play_* dvars).
; "PlayTest start" ignores the camera once
play_from_camera=1
; Fly box: noclip (with play_from_camera, spawn at the exact camera point)
play_fly=0
; Disable AI box: no AI spawns (the in-game bridge re-applies ai_disableSpawn 1 once a second)
disable_ai=0
; God box: the player takes no damage
play_god=0
; Join Host (Team Create, BO3 Enhanced): add the map to BO3's usermap list before joining so an unpublished map passes the mod check
join_usermap_entry=1
; Live Edit (BO3 Enhanced only): settled brush edits drawn in the running game through the injected BO3LiveBridge.dll
live_preview=1
; Live delete (BO3 Enhanced only): a deleted, moved or scaled brush loses its baked original in the game (undo brings it back). Needs live_preview=1
live_delete=1
; also let the player and bullets pass through the deleted brush
live_delete_collision=1
; also hide the interior brushes of a misc_prefab that was deleted or moved
live_delete_prefabs=1
; also hide a misc_model that was deleted or moved
live_delete_models=1
; Live models (needs live_zone=1): a moved or newly placed misc_model is spawned in the running game as a script_model.
; A model the level lacks is linked as a live zone first (auto_link_materials=1)
live_models=1
; Live spots: when a prefab instance moves, what the level's scripts spawned on its script_structs moves with it
live_spots=1
; the GSC receiver prints every live model spawn, pose and delete (diagnostics only)
live_models_debug=0
; Live decals (BO3 Enhanced only): a deleted, moved or changed misc_volume_decal is redrawn in the running game
live_decals=1
; Live lights (BO3 Enhanced only): a moved, edited, placed or deleted light changes in the running game (baked bounce stays as built)
live_lights=1
; Live fx (BO3 Enhanced only): a moved, edited, placed or deleted fx entity changes in the running game
live_fx=1
; Live sky (BO3 Enhanced only): a changed ssi shows its skybox, sun and exposure in the running game
live_sky=1
; after an ssi change, start Rebuild All in Radiant so the live bake sends the new lighting
live_sky_bake=1
; Live nav mesh (BO3 Enhanced only): exact Live Edit brushes cut the AI nav mesh in the running game
live_navmesh=1
; Live occlusion (BO3 Enhanced only): draw what the compiled Umbra occlusion still hides behind a deleted or moved baked brush
live_occlusion=1
; Nav refresh (BO3 Enhanced only): after settled brush edits the map is compiled again and the fresh nav mesh is swapped in
; (the pane's "Refresh Nav Mesh" button and `PlayTest nav` do it on demand). Off = old nav stays until UPDATE
live_nav_refresh=1
; UPDATE / RELOAD after a live zone was loaded: 1 reloads the map in the running game, 0 closes BO3 and starts it again
warm_after_live_zone=1
; draw the faces cod2map left out under a brush hidden in the game (a prefab sunk into the floor and moved)
live_fill_holes=1
; experimental: scripts and the BSP are linked as usermaps\<map>_patch and loaded after the base fastfile (BO3LiveZone.dll injected)
live_zone=0
; a material applied in Live Edit that the level lacks gets a carrier model in the patch zone, in the game from the next UPDATE / RELOAD. Needs live_zone=1
auto_link_materials=1
; material name prefixes (comma separated) whose carriers always go into the patch zone, e.g. preload_materials=mtl_p8_zm_esc_lab_,mtl_p8_zm_esc_cryo_
preload_materials=
; also load the new materials as a small zone into the running level (no reload)
live_material_load=1
; the hang watchdog terminates the game after this many seconds without an answer (0 = never)
hang_kill_seconds=12
; game language folder and extra BlackOps3.exe arguments
language=english
extra_args=
; the Dvars window: developer 1 or 2
dvar_developer=1
; split screen with 2 players, applied at game start
dvar_splitscreen=0
; logfile 0 to 2
dvar_logfile=0
; other dvars as name value; name value
dvar_custom=
; one-time migrations already applied
v19_engine_runtime_migrated=1
v17_game_pane_migrated=1
v17_safe_start_migrated=1
v20_instant_start_on=1
