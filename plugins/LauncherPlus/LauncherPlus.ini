; Faster builds from the stock BO3 Mod Tools Launcher.
; On/off: the Plugins checkbox, or the launcher's Launcher+ menu (compile, link and light switches).
; Every other key is a diagnostic switch: leave it at its default.

[launcherplus]
; Master override for every redirect below.
enabled=1

[compile]
; Route cod2map64.exe through BuildPlusWorker.exe.
enabled=1
; Above normal priority, Windows execution-speed throttling off.
prefer_performance=1
; In-process cod2map64 optimizations (BuildPlusCompiler.dll), exact compiler SHA-256 required.
patches=1
; When only entities changed since the last compile, run cod2map -onlyents (state in compile_state\).
smart_onlyents=1
; Individual optimizations (need patches=1): C1 coalesce lookup, C2 grid tree queries, C3 vertex merge,
; C4 edge neighbours, C5 triangle subgroups, C6 weld grid, C7 grid init, C8 collision flood fill,
; C9 material tessSize cache, C10 SplitSparseSoups group bounds, C11 soup split groups, C12 qhull memory arena.
c1=1
c2=1
c3=1
c4=1
c5=1
c6=1
c7=1
c8=1
c9=1
c10=1
c11=1
c12=1
; Add -timing so the launcher console shows per-stage times.
timing=0

[linker]
; Route linker_modtools.exe through BuildPlusLinker.exe.
enabled=1
; Above normal priority, Windows execution-speed throttling off.
prefer_performance=1
; In-process linker optimizations (BuildPlusLinkerRT.dll), exact linker SHA-256 required, works with or without L3akMod.
patches=1
; Individual optimizations (need patches=1): no per-asset UDP telemetry, Umbra tome poll every 2 ms, one D3D11 device
; per thread, mips on all cores, one WIC factory per thread, prefetch of the last link's files, one-call file stat,
; world-load UV recentering without quadratic scans.
skip_telemetry=1
umbra_poll=1
reuse_d3d_device=1
parallel_mip=1
reuse_wic=1
prefetch_files=1
fast_stat=1
fast_recenter=1
; Keep zone\en_<map>.ff when its inputs did not change since the last link (state in linker_state\).
skip_localized=1
; Skip sound\snd_convert.exe when nothing under sound_assets, share\raw\sound or the map's sound folder changed.
skip_sound_convert=1
; Auto LODs where stock fails: models over the 220,000-face limit (within the budget) and zero or NaN normals rebuilt.
autolod_fixes=1
; Memory budget in MB for over-limit reductions running together, 0 = 40% of the installed RAM.
autolod_budget_mb=0
; Auto LODs reduced by meshoptimizer instead of the stock simplifier: much faster, fewer broken LODs (APE+ and Radiant+ previews match).
meshopt_lods=0

[light]
; Route the Light step (Radiant_modtools.exe -ledSilent) through BuildPlusLight.exe. The "Radiant" button is never redirected.
enabled=1
; Load BuildPlusLightRT.dll (RadiantPlus's bake module), exact Radiant SHA-256 required.
patches=1
; Adaptive sampling: map (each probe's adaptive_quality_boost), low, medium or high. Empty = RadiantPlus.ini [bake].
adaptive=
; Cone correction: removes the brightness bias of the lower qualities. Empty = RadiantPlus.ini [bake].
cone=
; Draft tier LL, set by the Draft entry in the launcher's Light quality box: rays per voxel for a Low build (64 = Draft).
low_rays=256
; Diagnostics: dump every probe's final bounce to this folder as <dump_tag>_probe<dims>_b<bounce>.rgp (empty = off).
dump_dir=
dump_tag=run
; 1 = log every probe job to BuildPlusLight.log, 0 = settings and summary only.
guide_observe=0
; Speed, same output: end Radiant right after the export (fast_exit), reuse the fill's neighbour lists and plane fits (fill_cache, fill_fast: 1, verify or 0).
fast_exit=1
fill_cache=1
fill_fast=1
; Speed, same output: the bake module's own gather (1, verify = also run Radiant's and compare, 0 = off).
gather_fast=1
; Speed: open the files the last Light step read (plugins\LauncherPlus\light_prefetch\) on 16 threads while Radiant loads.
prefetch_files=1
; Speed: reuse traced hits when geometry and probe are unchanged (plugins\LauncherPlus\trace_cache\). 1 = on, verify = trace and compare, 0 = off.
trace_cache=1
trace_cache_mb=4096
; Diagnostics: log each bake phase and a 2 s heartbeat to BuildPlusLight.log.
timeline=0

[defender]
; Defender exclusions for cod2map64.exe, linker_modtools.exe and snd_convert.exe (Launcher+ menu, runs defender_exclusions.ps1 with UAC).
; exclusions=1: applied. asked=1: the one-time offer was shown.
exclusions=0
asked=0

[theme]
; The launcher's theme, set in its Theme menu: a theme of <game>\bin\themes, "Classic Treyarch" or classic.
; Empty = the launcher's own (Edit > Options). Without a name line (as shipped) the first run picks one and writes it here.

[discord]
; Discord Rich Presence: off, tool = only which tool is open, detail = also the map, asset or build step
mode=tool
; Discord application id, empty = the built-in one
app_id=
