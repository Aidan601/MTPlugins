; APE Plus plugin settings. Lives next to APEPlus.dll.

[filter]
; asset tree filter boxes: 1 = the plugin's engine (APE's own takes seconds per keystroke on a big gdt.db), 0 = APE's own
fast=1
; the value filter (key=value): 1 = the plugin's engine, 0 = APE's own (walks every property of every asset)
fast_value=1
; wait this long after the last keystroke before filtering (0 = filter on every keystroke)
debounce_ms=150

[commit]
; APE rescans the whole install after every committed value (about 2 s), the plugin skips it unless the disk changed
; top-level folders whose changes do not count (comma separated)
ignore_dirs=radiant,bin,gdtdb,share
; if the folder cannot be watched: skip a rescan within this many seconds of the previous one (0 = never skip)
scan_min_s=10
; 1 = only .gdt files and folders appearing, going or renamed count, 0 = every change counts
gdt_only=1

[theme]
; the look of APE, picked in View > Preferences > Theme. Empty or "default" = follow APE's own Treyarch setting
; built in: classic, Classic Treyarch. Others: any <name>.qss in the themes folder (themes\README.txt)
; no name line (as shipped) = first run: Treyarch if APE's "Use Treyarch Theme" was on, else Light, written here once

[preview]
; frame cap for the preview while an animation plays (it keeps its speed), 0 = uncapped like APE
max_fps=60
; converting a model never previewed: 1 = the plugin sorts faces per material and LOD once (same output, a 115k-face model 3.6 s -> 0.45 s), 0 = APE's own
fast_convert=1
; converting a model never previewed: 1 = the vertex cache order without APE's full vertex scan per dead end (same output), 0 = APE's own
fast_reorder=1
; Custom Sky (preview Rendering menu), both keys written by the menu: the last sky (any xmodel name) and 1 while it is the lighting
skybox=
skybox_on=0

[images]
; image formats accepted beyond TIFF, PNG and EXR (comma separated, empty = APE's list)
; the linker converts jpg, others Windows can decode (bmp, gif) are unchecked
extra_formats=jpg,jpeg

[open]
; opening an asset (a 75-camo weaponcamo: 13 s in APE, 1.2 s with all three on)
; lazy_popups: completer lists are built on first use. fast_swap: cheaper old grid delete and polish
; thumb_cache: image thumbnails reuse the decoded image while the file is unchanged
lazy_popups=1
fast_swap=1
thumb_cache=1
; memory for decoded images (16 to 2048); entries unused for two minutes are dropped
thumb_cache_mb=128

[startup]
; 1 = cache techset include searches during APE's startup techsetdef scan (the first material waits for it), 0 = APE's own, verify = both and compare
techset_search_cache=1

[deffiles]
; 1 = APE reads the .awi files in the deffiles folder next to this file instead of the installed ones of the same name
; (installed files are not changed), 0 = the installed ones. Any .awi or header put there replaces the installed one
; "APEPlus awi on|off" switches live, an open asset tab keeps its grid until reopened
override=1

[actionlog]
; 1 = show property edits, asset switches and menu actions in the Output pane (set by the "Log actions" box in its title bar)
enabled=0
; entries kept for "APEPlus actionlog tail"
max_lines=2000
; 1 = keep the last 15 minutes (at most 300 entries) in actionlog.log for "Report a problem...", shown or not
; 0 = recorded only while shown, no file
in_reports=1

[notesounds]
; 1 = the preview plays the sound notetracks of an xanim while it animates, 0 = silent like APE
enabled=1
; 1 = the GDT notes whose Action is Sound, 2D Sound, Vox or a looping sound (Notetracks, SOUND Notetracks)
gdt=1
; 1 = the sndnt#<alias> notetracks exported in the anim file
exported=1
; loudness on top of the alias's VolMin/VolMax (0 to 4)
volume=1

[xanimpreview]
; 1 = the preview plays useBones 0 (viewmodel) xanims without warping and fixes the Preview Options attach, 0 = like APE
enabled=1
; 1 = the attached model plays the xanim too when it has bones the anim moves (a gun in a viewmodel anim)
attach_anim=1

[colorpicker]
; 1 = hex, 0-1 float and Kelvin rows and copy buttons in the Select Color dialog, 0 = off
extras=1

[discord]
; Discord Rich Presence: off, tool = only which tool is open, detail = also the map, asset or build step
mode=tool
; Discord application id, empty = the built-in one
app_id=
